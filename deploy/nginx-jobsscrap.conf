server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.example.com;
    ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://www.linkedin.com; frame-ancestors 'none'" always;

    location = /api/send {
        # Email with a base64 CV attachment (max 5 MB raw).
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:4183;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Auth-Request-Redirect $ic_rd;
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:4183;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # $ic_rd (full return URL for your shared SSO host) is a map in sites-available/sso.
        proxy_set_header X-Auth-Request-Redirect $ic_rd;
        # Never let a browser supply the identity headers oauth2-proxy sets.
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_read_timeout 30s;
    }
}
